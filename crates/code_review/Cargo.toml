[package]
name = "code_review"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/code_review.rs"
doctest = false

[dependencies]
anyhow.workspace = true
askpass.workspace = true
buffer_diff.workspace = true
collections.workspace = true
command_palette_hooks.workspace = true
db.workspace = true
editor.workspace = true
file_icons.workspace = true
fs.workspace = true
futures.workspace = true
futures-lite.workspace = true
fuzzy.workspace = true
git.workspace = true
git_ui.workspace = true
git_ui_core.workspace = true
gpui.workspace = true
http_client.workspace = true
ignore.workspace = true
language.workspace = true
log.workspace = true
markdown.workspace = true
menu.workspace = true
multi_buffer.workspace = true
picker.workspace = true
project.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
smallvec.workspace = true
time.workspace = true
time_format.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[dev-dependencies]
buffer_diff = { workspace = true, features = ["test-support"] }
command_palette = { workspace = true, features = ["test-support"] }
ctor.workspace = true
db = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
git = { workspace = true, features = ["test-support"] }
git_hosting_providers.workspace = true
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
# `project`'s test support turns on `remote`'s, whose extra variant `remote_connection` (through
# `git_ui`) only matches with its own test support.
remote_connection = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
theme.workspace = true
theme_settings.workspace = true
unindent.workspace = true
vim.workspace = true
workspace = { workspace = true, features = ["test-support"] }
zlog.workspace = true

[package.metadata.cargo-shear]
ignored = ["remote_connection"]
